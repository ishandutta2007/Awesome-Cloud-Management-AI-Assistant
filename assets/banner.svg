<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accent-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accent-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 44px; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #cbd5e1; }

    /* Keyframe Animations */
    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; }
    }
    @keyframes float-element {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes dash-move {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -32; }
    }

    .floating-cloud { animation: float-element 5s ease-in-out infinite; }
    .pulsing-dot { animation: pulse-dot 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .flow-line { stroke-dasharray: 8 8; animation: dash-move 3s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="350" rx="16" fill="url(#bg-grad)" stroke="#334155" stroke-width="2" />

  <!-- Background Cloud Shapes -->
  <g class="floating-cloud" opacity="0.2">
    <path d="M 120 180 A 45 45 0 0 1 190 140 A 55 55 0 0 1 290 160 A 35 35 0 0 1 310 220 L 120 220 Z" fill="url(#accent-grad-2)" />
    <path d="M 880 140 A 45 45 0 0 1 950 100 A 55 55 0 0 1 1050 120 A 35 35 0 0 1 1070 180 L 880 180 Z" fill="url(#accent-grad-2)" />
  </g>

  <!-- Animated Connection Lines -->
  <g stroke="url(#accent-grad-1)" stroke-width="2" opacity="0.35" class="flow-line">
    <path d="M 80 80 Q 200 40 350 90" fill="none" />
    <path d="M 850 260 Q 1000 300 1120 240" fill="none" />
    <path d="M 950 80 Q 1080 120 1140 60" fill="none" />
  </g>

  <!-- Pulsing Nodes -->
  <circle cx="80" cy="80" r="6" fill="#ec4899" class="pulsing-dot" />
  <circle cx="350" cy="90" r="8" fill="#6366f1" class="pulsing-dot" style="animation-delay: 1s;" />
  <circle cx="1120" cy="240" r="7" fill="#a855f7" class="pulsing-dot" style="animation-delay: 0.5s;" />
  <circle cx="950" cy="80" r="6" fill="#38bdf8" class="pulsing-dot" style="animation-delay: 1.5s;" />

  <!-- Bottom Gradient Strip -->
  <rect x="0" y="342" width="1200" height="8" rx="4" fill="url(#accent-grad-1)" />

  <!-- Main Content Group -->
  <g transform="translate(600, 155)" text-anchor="middle">
    <!-- Category Pill Badge -->
    <g transform="translate(-160, -95)">
      <rect width="320" height="34" rx="17" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
      <text x="160" y="22" text-anchor="middle" class="badge-text">AWESOME CLOUD AI ASSISTANTS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="-10" class="title">Cloud Management AI Assistant</text>
    
    <!-- Subtitle -->
    <text x="0" y="35" class="subtitle">Curated FinOps Copilots, AIOps, Autonomous Remediation &amp; Cloud Ops AI</text>

    <!-- Feature Pills -->
    <g transform="translate(-310, 75)">
      <g transform="translate(0, 0)">
        <rect width="180" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
        <text x="90" y="21" text-anchor="middle" class="pill-text">AI Cloud Copilots</text>
      </g>
      <g transform="translate(195, 0)">
        <rect width="230" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
        <text x="115" y="21" text-anchor="middle" class="pill-text">FinOps &amp; Cost Intelligence</text>
      </g>
      <g transform="translate(440, 0)">
        <rect width="180" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
        <text x="90" y="21" text-anchor="middle" class="pill-text">Open-Source AIOps</text>
      </g>
    </g>
  </g>
</svg>
